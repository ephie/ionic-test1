<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Neal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">neal</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="load($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-note color="danger" *ngIf="error" class="ion-padding">{{ error }}</ion-note>

  <ion-list>
    <ion-list-header>Items (from C# API)</ion-list-header>
    <ion-item *ngFor="let item of items">
      <ion-label>
        <h2>{{ item.name }}</h2>
        <p>{{ item.description }}</p>
      </ion-label>
      <ion-badge slot="end">{{ item.quantity }}</ion-badge>
    </ion-item>
  </ion-list>

  <ion-list>
    <ion-list-header>Contacts (from C# API)</ion-list-header>
    <ion-item *ngFor="let c of contacts">
      <ion-label>
        <h2>{{ c.name }}</h2>
        <p>{{ c.email }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
